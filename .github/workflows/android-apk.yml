name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "context/**"
      - "hooks/**"
      - "services/**"
      - "package.json"
      - "package-lock.json"
      - "app.json"
      - "babel.config.cjs"
      - "metro.config.cjs"
      - "metro.config.js"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installable Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.5.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Cache Gradle and Android native build outputs
        uses: actions/cache@0c45773b623bea8c8e75f6c82b208c3cf94ea4f9 # v4.2.4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.cxx
            android/app/.cxx
          key: android-gradle-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json') }}-${{ github.sha }}
          restore-keys: |
            android-gradle-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json') }}-
            android-gradle-${{ runner.os }}-

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build APK
        working-directory: android
        timeout-minutes: 35
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
          GRADLE_OPTS: "-Dorg.gradle.workers.max=2 -Dorg.gradle.parallel=false"
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 --stacktrace --info assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: xu-wallet-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish test-build download
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          TAG="android-test-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "$APK"             --repo "$GITHUB_REPOSITORY"             --title "XU Wallet Android test build ${GITHUB_RUN_NUMBER}"             --notes "Installable debug-signed APK built from commit ${GITHUB_SHA}. This is a test build, not a security-audited production release."             --prerelease
