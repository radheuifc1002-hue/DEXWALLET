name: Build standalone Android APK
# CI-only optimization trial: preserve dependency mtimes, cache Metro transforms, and profile Gradle tasks.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "assets/**"
      - "components/**"
      - "context/**"
      - "hooks/**"
      - "services/**"
      - "mobile/**"
      - "index.js"
      - "package.json"
      - "package-lock.json"
      - "app.json"
      - "babel.config.cjs"
      - "metro.config.cjs"
      - "metro.config.js"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build standalone Android release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.5.0
        with:
          distribution: temurin
          java-version: "17"

      # The native CMake build directories are cached separately. Restoring the
      # exact dependency tree avoids re-extracting native source files on every
      # run, which can invalidate Ninja/CMake incremental-build checks.
      - name: Restore dependency tree to preserve native source timestamps
        id: node-modules-cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-v1-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}

      - name: Install and align Expo SDK dependencies
        env:
          NODE_MODULES_CACHE_HIT: ${{ steps.node-modules-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [[ "$NODE_MODULES_CACHE_HIT" == "true" ]]; then
            echo "Reusing the locked node_modules tree; skipping reinstall to preserve native source timestamps."
          else
            npm install --no-audit --no-fund
            npx expo install --fix
          fi
          npx expo install --check
          node -e "const r=require('react/package.json').version; const d=require('react-dom/package.json').version; const rn=require('react-native/package.json').version; console.log('Resolved runtime:', {react:r, reactDom:d, reactNative:rn}); if(r!=='19.2.0'||d!=='19.2.0'||!rn.startsWith('0.83.')) process.exit(1)"

      # Save the pristine dependency tree before Gradle creates native build outputs.
      - name: Save dependency tree for future incremental native builds
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: node-modules-v1-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}


      - name: Generate Android icon and splash PNG assets
        run: |
          set -euo pipefail
          mkdir -p assets
          npx --yes sharp-cli -i assets/icon.svg -o assets/icon.png resize 1024 1024
          npx --yes sharp-cli -i assets/splash.svg -o assets/splash.png resize 1024 1024
          test -s assets/icon.png
          test -s assets/splash.png
          file assets/icon.png assets/splash.png

      - name: Force the standalone native entry configuration
        run: |
          rm -f metro.config.js
          rm -rf node_modules/expo-dev-client node_modules/expo-dev-launcher
          test ! -d node_modules/expo-dev-client
          test ! -d node_modules/expo-dev-launcher
          node -e "const p=require('./package.json'); if (p.main !== 'index.js') process.exit(1); console.log('Native entry:', p.main)"
          npx expo config --type public

      - name: Start with a clean generated Android project
        run: rm -rf android

      # Cache the entire generated Android project, including Gradle history,
      # intermediates, native build outputs, and the packaged APK.
      - name: Restore complete Android project and build outputs
        id: android-project-cache
        uses: actions/cache/restore@v4
        with:
          path: android
          key: android-project-v2-${{ runner.os }}-${{ hashFiles('package.json', 'app.json', 'babel.config.cjs', 'assets/icon.svg', 'assets/splash.svg') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            android-project-v2-${{ runner.os }}-${{ hashFiles('package.json', 'app.json', 'babel.config.cjs', 'assets/icon.svg', 'assets/splash.svg') }}-

      - name: Check whether Android project was restored
        id: android-project-state
        shell: bash
        run: |
          if [[ -f android/gradlew && -f android/app/build.gradle ]]; then
            echo "restored=true" >> "$GITHUB_OUTPUT"
            echo "Compatible Android project cache found; skipping Expo prebuild."
          else
            echo "restored=false" >> "$GITHUB_OUTPUT"
            echo "No compatible Android project cache; generating the Android project."
          fi

      - name: Generate native Android project
        if: steps.android-project-state.outputs.restored != 'true'
        env:
          EXPO_ROUTER_APP_ROOT: app
        run: npx expo prebuild --platform android --no-install

      # Keep this path list unchanged so it can restore the existing v2 cache.
      # Restore it after prebuild because prebuild recreates android/.
      - name: Restore Gradle and native CMake dependency cache
        id: gradle-native-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/app/.cxx
            node_modules/*/android/.cxx
          key: android-release-v2-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            android-release-v2-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            android-release-v2-${{ runner.os }}-
            android-release-${{ runner.os }}-

      - name: Restore native module Gradle outputs
        id: native-module-cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules/**/android/build
          key: android-module-build-v1-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            android-module-build-v1-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}-
      - name: Install required Android SDK native toolchain
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "ndk;27.1.12297006" "cmake;3.22.1"
          test -d "$ANDROID_HOME/ndk/27.1.12297006"
      # Expo/Metro normally keeps its transformer cache under the ephemeral
      # system temp directory. Persist it so unchanged modules are not transformed
      # from scratch inside every Gradle release build.
      - name: Restore Metro transform cache
        id: metro-transform-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/metro-cache
          key: metro-transform-v1-${{ runner.os }}-${{ hashFiles('package-lock.json', 'babel.config.cjs', 'metro.config.cjs') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            metro-transform-v1-${{ runner.os }}-${{ hashFiles('package-lock.json', 'babel.config.cjs', 'metro.config.cjs') }}-

      - name: Build standalone release APK
        id: android-build
        working-directory: android
        timeout-minutes: 55
        env:
          EXPO_ROUTER_APP_ROOT: app
          EXPO_METRO_CACHE_OUTPUT_DIR: ${{ runner.temp }}/metro-cache
          CMAKE_BUILD_PARALLEL_LEVEL: "4"
          NODE_ENV: production
          GRADLE_OPTS: "-Dorg.gradle.workers.max=4 -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"
        run: |
          set -euo pipefail
          mkdir -p "$EXPO_METRO_CACHE_OUTPUT_DIR"
          chmod +x gradlew
          ./gradlew --max-workers=4 --parallel --stacktrace --info --profile --build-cache -PreactNativeArchitectures=arm64-v8a assembleRelease -x lintVitalAnalyzeRelease -x lintVitalRelease
          METRO_CACHE_FILES=$(find "$EXPO_METRO_CACHE_OUTPUT_DIR" -type f | wc -l)
          echo "Metro transform cache files: $METRO_CACHE_FILES"

      - name: Upload Gradle task profile
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: gradle-profile-report
          path: android/build/reports/profile/*.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Save Metro transform cache
        if: ${{ always() && steps.android-build.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/metro-cache
          key: metro-transform-v1-${{ runner.os }}-${{ hashFiles('package-lock.json', 'babel.config.cjs', 'metro.config.cjs') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save complete Android project and build outputs
        if: ${{ always() && steps.android-build.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: android
          key: ${{ steps.android-project-cache.outputs.cache-primary-key }}

      - name: Save Gradle and native CMake dependency cache
        if: ${{ always() && steps.android-build.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/app/.cxx
            node_modules/*/android/.cxx
          key: ${{ steps.gradle-native-cache.outputs.cache-primary-key }}

      - name: Save native module Gradle outputs
        if: ${{ always() && steps.android-build.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: node_modules/**/android/build
          key: ${{ steps.native-module-cache.outputs.cache-primary-key }}
      - name: Verify APK contains a bundled native application
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -l "$APK" > /tmp/xu-apk-files.txt
          grep -E 'assets/index.android.bundle|assets/.*\\.bundle' /tmp/xu-apk-files.txt
          BUNDLE_SIZE=$(unzip -p "$APK" assets/index.android.bundle | wc -c)
          test "$BUNDLE_SIZE" -gt 1000000
          echo "Embedded JS bundle size: $BUNDLE_SIZE bytes"
          echo "Essential APK checks passed."

      - name: Upload standalone APK artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: xu-wallet-standalone-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish test-build download
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          TAG="android-release-test-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "XU Wallet standalone Android test build ${GITHUB_RUN_NUMBER}" \
            --notes "Standalone release-variant APK from commit ${GITHUB_SHA}. Test build only; not security-audited for real funds." \
            --prerelease
