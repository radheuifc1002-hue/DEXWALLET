name: Build standalone Android APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "context/**"
      - "hooks/**"
      - "services/**"
      - "mobile/**"
      - "package.json"
      - "package-lock.json"
      - "app.json"
      - "babel.config.cjs"
      - "metro.config.cjs"
      - "metro.config.js"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build standalone Android release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.5.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Cache Gradle and Android native build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            node_modules/react-native-reanimated/android/.cxx
            node_modules/react-native-worklets/android/.cxx
          key: android-release-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json', 'babel.config.cjs', 'metro.config.cjs') }}
          restore-keys: |
            android-release-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json', 'babel.config.cjs', 'metro.config.cjs') }}
            android-release-${{ runner.os }}-

      - name: Generate native Android project
        env:
          EXPO_ROUTER_APP_ROOT: app
        run: npx expo prebuild --platform android --no-install

      - name: Build standalone release APK
        working-directory: android
        timeout-minutes: 55
        env:
          EXPO_ROUTER_APP_ROOT: app
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
          GRADLE_OPTS: "-Dorg.gradle.workers.max=2 -Dorg.gradle.parallel=false -Dorg.gradle.caching=true"
        run: |
          chmod +x gradlew
          ./gradlew --max-workers=2 --stacktrace --build-cache -PreactNativeArchitectures=arm64-v8a assembleRelease -x lintVitalAnalyzeRelease -x lintVitalRelease

      - name: Verify APK exists and is non-empty
        run: test -s android/app/build/outputs/apk/release/app-release.apk

      - name: Upload standalone APK artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: xu-wallet-standalone-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish test-build download
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          TAG="android-release-test-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "XU Wallet standalone Android test build ${GITHUB_RUN_NUMBER}" \
            --notes "Standalone release-variant APK from commit ${GITHUB_SHA}. Test build only; not security-audited for real funds." \
            --prerelease
