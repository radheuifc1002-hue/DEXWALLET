name: Build standalone Android APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "assets/**"
      - "components/**"
      - "context/**"
      - "hooks/**"
      - "services/**"
      - "mobile/**"
      - "package.json"
      - "package-lock.json"
      - "app.json"
      - "babel.config.cjs"
      - "metro.config.cjs"
      - "metro.config.js"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build standalone Android release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.5.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Cache Gradle and Android native build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            node_modules/react-native-reanimated/android/.cxx
            node_modules/react-native-worklets/android/.cxx
          key: android-release-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json', 'babel.config.cjs', 'metro.config.cjs') }}
          restore-keys: |
            android-release-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json', 'babel.config.cjs', 'metro.config.cjs') }}
            android-release-${{ runner.os }}-

      - name: Generate Android icon and splash PNG assets
        run: |
          set -euo pipefail
          mkdir -p assets
          npx --yes sharp-cli -i assets/icon.svg -o assets/icon.png resize 1024 1024
          npx --yes sharp-cli -i assets/splash.svg -o assets/splash.png resize 1024 1024
          test -s assets/icon.png
          test -s assets/splash.png
          file assets/icon.png assets/splash.png

      - name: Force the standalone native entry configuration
        run: |
          # This repository has both Vite web code and an Expo native app.
          # Keep Metro on the CommonJS config; the duplicate ESM config can
          # accidentally take precedence in environments with "type": "module.
          rm -f metro.config.js
          # The dev client is not part of a standalone release APK. Remove its
          # installed native modules without changing the lockfile or web dependencies.
          rm -rf node_modules/expo-dev-client node_modules/expo-dev-launcher
          test ! -d node_modules/expo-dev-client
          test ! -d node_modules/expo-dev-launcher
          node -e "const p=require('./package.json'); if (p.main !== 'index.js') process.exit(1); console.log('Native entry:', p.main)"
          npx expo config --type public

      - name: Generate native Android project
        env:
          EXPO_ROUTER_APP_ROOT: app
        run: npx expo prebuild --platform android --no-install

      - name: Build standalone release APK
        working-directory: android
        timeout-minutes: 55
        env:
          EXPO_ROUTER_APP_ROOT: app
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
          GRADLE_OPTS: "-Dorg.gradle.workers.max=2 -Dorg.gradle.parallel=false -Dorg.gradle.caching=true"
        run: |
          chmod +x gradlew
          ./gradlew --max-workers=2 --stacktrace --build-cache -PreactNativeArchitectures=arm64-v8a assembleRelease -x lintVitalAnalyzeRelease -x lintVitalRelease

      - name: Verify APK contains a bundled native application
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -l "$APK" > /tmp/xu-apk-files.txt
          grep -E 'assets/index.android.bundle|assets/.*\.bundle' /tmp/xu-apk-files.txt
          # A release APK should not depend on the Expo development launcher.
          if unzip -p "$APK" classes.dex 2>/dev/null | strings | grep -qi 'expo/modules/devlauncher'; then
            echo "Unexpected Expo development launcher reference found in classes.dex"
            exit 1
          fi
          echo "Standalone bundle found; development-launcher check passed."
          # Confirm the bundled UI includes native app routes rather than only a launcher shell.
          unzip -p "$APK" assets/index.android.bundle | strings > /tmp/xu-js-bundle-strings.txt
          grep -qi 'onboarding' /tmp/xu-js-bundle-strings.txt
          grep -qi 'Your Keys' /tmp/xu-js-bundle-strings.txt
          # Confirm Android launcher icon resources were generated.
          grep -E 'res/mipmap.*/(ic_launcher|ic_launcher_round)' /tmp/xu-apk-files.txt

      - name: Upload standalone APK artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: xu-wallet-standalone-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish test-build download
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          TAG="android-release-test-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "XU Wallet standalone Android test build ${GITHUB_RUN_NUMBER}" \
            --notes "Standalone release-variant APK from commit ${GITHUB_SHA}. Test build only; not security-audited for real funds." \
            --prerelease
