name: Build standalone Android APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "assets/**"
      - "components/**"
      - "context/**"
      - "hooks/**"
      - "services/**"
      - "mobile/**"
      - "index.js"
      - "package.json"
      - "package-lock.json"
      - "app.json"
      - "babel.config.cjs"
      - "metro.config.cjs"
      - "metro.config.js"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build standalone Android release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.5.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install and align Expo SDK dependencies
        run: |
          npm install --no-audit --no-fund
          npx expo install --fix
          npx expo install --check
          node -e "const r=require('react/package.json').version; const d=require('react-dom/package.json').version; const rn=require('react-native/package.json').version; console.log('Resolved runtime:', {react:r, reactDom:d, reactNative:rn}); if(r!=='19.2.0'||d!=='19.2.0'||!rn.startsWith('0.83.')) process.exit(1)"

      - name: Cache Gradle and Android native build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/app/.cxx
            node_modules/*/android/.cxx
          key: android-release-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json', 'app.json', 'babel.config.cjs', 'metro.config.cjs') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            android-release-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json', 'app.json', 'babel.config.cjs', 'metro.config.cjs') }}-
            android-release-${{ runner.os }}-

      - name: Generate Android icon and splash PNG assets
        run: |
          set -euo pipefail
          mkdir -p assets
          npx --yes sharp-cli -i assets/icon.svg -o assets/icon.png resize 1024 1024
          npx --yes sharp-cli -i assets/splash.svg -o assets/splash.png resize 1024 1024
          test -s assets/icon.png
          test -s assets/splash.png
          file assets/icon.png assets/splash.png

      - name: Force the standalone native entry configuration
        run: |
          rm -f metro.config.js
          rm -rf node_modules/expo-dev-client node_modules/expo-dev-launcher
          test ! -d node_modules/expo-dev-client
          test ! -d node_modules/expo-dev-launcher
          node -e "const p=require('./package.json'); if (p.main !== 'index.js') process.exit(1); console.log('Native entry:', p.main)"
          npx expo config --type public

      - name: Generate native Android project
        env:
          EXPO_ROUTER_APP_ROOT: app
        run: npx expo prebuild --platform android --no-install

      - name: Build standalone release APK
        working-directory: android
        timeout-minutes: 55
        env:
          EXPO_ROUTER_APP_ROOT: app
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
          NODE_ENV: production
          GRADLE_OPTS: "-Dorg.gradle.workers.max=4 -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"
        run: |
          chmod +x gradlew
          ./gradlew --max-workers=4 --parallel --stacktrace --build-cache -PreactNativeArchitectures=arm64-v8a assembleRelease -x lintVitalAnalyzeRelease -x lintVitalRelease

      - name: Verify APK contains a bundled native application
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -l "$APK" > /tmp/xu-apk-files.txt
          grep -E 'assets/index.android.bundle|assets/.*\\.bundle' /tmp/xu-apk-files.txt
          BUNDLE_SIZE=$(unzip -p "$APK" assets/index.android.bundle | wc -c)
          test "$BUNDLE_SIZE" -gt 1000000
          echo "Embedded JS bundle size: $BUNDLE_SIZE bytes"
          echo "Essential APK checks passed."

      - name: Upload standalone APK artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: xu-wallet-standalone-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish test-build download
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          TAG="android-release-test-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "XU Wallet standalone Android test build ${GITHUB_RUN_NUMBER}" \
            --notes "Standalone release-variant APK from commit ${GITHUB_SHA}. Test build only; not security-audited for real funds." \
            --prerelease

      - name: Persist Expo-normalized package manifest and lockfile
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for FILE in package.json package-lock.json; do
            if git diff --quiet -- "$FILE"; then
              echo "$FILE already matches the installed dependency graph."
              continue
            fi
            CONTENT="$(base64 -w 0 "$FILE")"
            SHA="$(gh api "repos/${GITHUB_REPOSITORY}/contents/$FILE?ref=main" --jq .sha)"
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/$FILE" \
              -f message="Align dependency lockfile with Expo SDK 55 [skip ci]" \
              -f content="$CONTENT" \
              -f sha="$SHA" \
              -f branch=main
          done
