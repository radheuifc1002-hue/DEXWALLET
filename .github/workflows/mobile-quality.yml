name: Mobile quality gates

on:
  pull_request:
    branches: [main, infra/phase-2-rpc-health-failover, infra/phase-2-generic-history]
    paths:
      - "app/**"
      - "context/**"
      - "mobile/**"
      - "web-app/**"
      - "backend/api/**"
      - "tests/**"
      - "components/**"
      - "package.json"
      - "package-lock.json"
      - "app.json"
      - "tsconfig.json"
      - ".github/workflows/mobile-quality.yml"
  push:
    branches: [main, infra/phase-2-rpc-health-failover, infra/phase-2-generic-history]
    paths:
      - "app/**"
      - "context/**"
      - "web-app/**"
      - "mobile/**"
      - "backend/api/**"
      - "tests/**"
      - "components/**"
      - "package.json"
      - "package-lock.json"
      - "app.json"
      - "tsconfig.json"
      - ".github/workflows/mobile-quality.yml"

permissions:
  contents: read

concurrency:
  group: mobile-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-bundle:
    name: TypeScript validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check the application
        run: npx tsc --noEmit

      - name: Type-check the backend API independently
        run: npx tsc --noEmit -p backend/tsconfig.json

      - name: Run RPC and transaction-history regression tests
        run: node --test tests/*.test.mjs
